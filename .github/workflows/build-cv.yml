# Build all CV variants on every push to a PR, upload the PDFs as a
# workflow artifact, and upsert a PR comment with links.
name: Build CV

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

# Permissions are granted per job below: only the build job comments on
# the PR, so only it holds pull-requests: write.
permissions: {}

# One run per PR (or ref, for manual runs); newer pushes cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit in the PR must be a Conventional Commit: the release job
  # derives the version and the changelog from them, so a malformed message
  # is a silently wrong release later.
  commits:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Resolve a browser and gate hard on .chrome-version — a PR is where
      # a human can act on a mismatch. Rationale and the re-baseline recipe
      # live in the action itself.
      - name: Resolve and check Chromium
        uses: ./.github/actions/resolve-chromium
        with:
          strict: 'true'

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # The builder exits non-zero if any variant fails the one-page check,
      # which fails this job. Output is captured for the PR comment summary.
      - name: Build PDFs (HTML -> Chromium -> PDF)
        id: web
        run: node build.ts 2>&1 | tee web-summary.txt

      - name: Upload PDFs
        id: upload-web
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-pdfs
          path: dist/*.pdf
          retention-days: 30
          if-no-files-found: warn

      # Upsert a single marker-tagged PR comment with links to the run and
      # the uploaded artifact (artifact-url output from upload-artifact@v4).
      # The comment is a convenience, not a gate: continue-on-error keeps a
      # GitHub API hiccup from reddening a build that actually passed, which
      # is exactly what a 503 here did once. retries covers the transient 5xx
      # case so it usually does not come to that.
      - name: Post / update PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WEB_ARTIFACT_URL: ${{ steps.upload-web.outputs.artifact-url }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const marker = '<!-- cv-artifacts -->';
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').trim(); } catch { return ''; } };
            const link = (name, url) => url ? `[\`${name}\`](${url})` : `\`${name}\` (upload failed)`;
            const badge = (outcome) => outcome === 'success' ? 'passed ✓' : `**${outcome} ✗**`;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;

            const sections = [];
            const web = read('web-summary.txt');
            if (web) sections.push(`<details><summary>Build output</summary>\n\n\`\`\`\n${web}\n\`\`\`\n</details>`);

            const body = [
              marker,
              `### CV build artifacts`,
              ``,
              `Built from ${sha} · [workflow run](${runUrl})`,
              ``,
              `| Artifact | Build | Download |`,
              `| --- | --- | --- |`,
              `| cv-pdfs (Chromium) | ${badge(process.env.WEB_OUTCOME)} | ${link('cv-pdfs', process.env.WEB_ARTIFACT_URL)} |`,
              ``,
              ...sections,
              ``,
              `_Artifact downloads require being logged in to GitHub; artifacts expire after 30 days._`,
            ].join('\n');

            // Upsert: find our previous marker-tagged comment and update it,
            // otherwise create a new one.
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

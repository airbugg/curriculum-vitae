# On every update to master: rebuild the CV PDFs, publish them as a
# GitHub release (no binaries persisted in the repo), and refresh the
# README's preview banner so it always shows the current CV.
name: Release CV

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version and changelog are derived from
      # the commits since the last v* tag.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build PDFs
        run: node build.ts

      - name: Refresh README preview banner
        run: node scripts/preview.ts

      # Commits only when the banner actually changed; [skip ci] stops this
      # push from re-triggering the workflow it was made by, and the release
      # notes filter the same marker out.
      - name: Commit the preview banner
        run: |
          if ! git diff --quiet -- docs/cv-preview.png; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/cv-preview.png
            git commit -m "chore(readme): refresh CV preview [skip ci]"
            git push origin HEAD:master
          fi

      # Version and changelog from the Conventional Commits since the last
      # v* tag: breaking → major, feat → minor, everything else → patch.
      - name: Compute version and release notes
        id: release
        run: node scripts/release.ts

      # Marked latest, so stable URLs keep working:
      #   releases/latest/download/eugene-lerman.pdf  (and the other variants)
      - name: Create release with the PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          make_latest: true
          body_path: release-notes.md
          files: dist/*.pdf

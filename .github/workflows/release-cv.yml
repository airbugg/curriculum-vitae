# On every update to master: rebuild the CV PDFs, publish them as a
# GitHub release (no binaries persisted in the repo), and refresh the
# README's preview banner so it always shows the current CV.
name: Release CV

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build PDFs
        run: node build.ts 2>&1 | tee build-summary.txt

      - name: Refresh README preview banner
        run: node scripts/preview.ts

      # Commits only when the banner actually changed; [skip ci] stops this
      # push from re-triggering the workflow it was made by.
      - name: Commit the preview banner
        run: |
          if ! git diff --quiet -- docs/cv-preview.png; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/cv-preview.png
            git commit -m "Refresh README CV preview [skip ci]"
            git push origin HEAD:master
          fi

      # Date + short-SHA tags sort naturally and stay unique per push.
      - name: Compute release tag
        run: echo "TAG=cv-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Marked latest, so stable URLs keep working:
      #   releases/latest/download/eugene-lerman.pdf  (and the other variants)
      - name: Create release with the PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CV ${{ env.TAG }}
          make_latest: true
          body_path: build-summary.txt
          files: dist/*.pdf

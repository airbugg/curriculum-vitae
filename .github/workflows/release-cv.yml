# On every update to master: rebuild the CV PDFs, publish them as a
# GitHub release (no binaries persisted in the repo), and refresh the
# README's preview banner so it always shows the current CV.
name: Release CV

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version and changelog are derived from
      # the commits since the last v* tag.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update && sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # The browser build is baked into the rendered PDFs (/Producer Skia/PDF
      # mNNN), and ubuntu-latest's Chrome auto-updates underneath us, so a
      # runner-image refresh can shift the pixel-tuned output with no commit
      # in this repo. .chrome-version tracks the RUNNER's Chrome, which is
      # what builds the released PDFs; a local browser will often differ, so
      # "rebuild locally and compare" is not the remedy. To clear a mismatch:
      # download the cv-pdfs artifact from the run, check every page still
      # look right, then set .chrome-version to the reported major.
      # Note this compares the major only; output can still shift within one.
      - name: Check Chromium version
        continue-on-error: true
        run: |
          EXPECTED="$(cat .chrome-version)"
          ACTUAL="$("$CHROME_PATH" --version 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -1 | cut -d. -f1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::warning::Chrome major is ${ACTUAL:-unreadable}, expected $EXPECTED (.chrome-version). This release may not be pixel-identical to the last. Publishing anyway; open a PR to re-baseline."
          else
            echo "Chrome major $ACTUAL matches .chrome-version"
          fi

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build PDFs
        run: node build.ts

      - name: Refresh README preview banner
        run: node scripts/preview.ts

      # Commits only when the banner actually changed; [skip ci] stops this
      # push from re-triggering the workflow it was made by. It does appear
      # in that release's notes under Chores, which is honest: the banner in
      # the README really did change.
      - name: Commit the preview banner
        run: |
          if ! git diff --quiet -- docs/cv-preview.png; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/cv-preview.png
            git commit -m "chore(readme): refresh CV preview [skip ci]"
            git push origin HEAD:master
          fi

      # semantic-release tags v<major.minor.patch>, writes the changelog from
      # the Conventional Commits since the last tag, and attaches the PDFs.
      # Config in .releaserc.json. Stable URLs keep working, because the
      # newest release is the latest one:
      #   releases/latest/download/eugene-lerman.pdf  (and the other variants)
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release exits 0 when it decides there is nothing to release,
      # which happens when no commit subject since the last tag parses as a
      # Conventional Commit. GitHub's web editor defaults to "Update
      # content/jobs/3-rewire.md", which does not — and nothing lints a direct
      # push to master, because the commit-msg hook is client-side and the
      # commitlint job only runs on pull requests. Without this guard the run
      # goes green, the PDFs are built and thrown away, and the stable
      # download URL quietly keeps serving the old CV.
      - name: Fail if nothing was released
        run: |
          git fetch --tags --quiet
          if [ -z "$(git tag --points-at HEAD -l 'v*')" ]; then
            echo "::error::PDFs were built but NOT published: no commit since the last release has a Conventional Commit subject, so no version was cut. Fix by pushing another commit whose subject looks like 'docs(cv): update the Rewire bullets' (type: feat, fix, docs, refactor, chore, ...). The previous release is still what the download links serve."
            exit 1
          fi
          echo "Released $(git tag --points-at HEAD -l 'v*')"
